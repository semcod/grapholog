[package]
name = "grapholog-rs"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Native Rust implementation of Grapholog project syntax graphs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-php = "=0.24.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-python = "=0.25.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
