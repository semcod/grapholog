<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'">
<title>Grapholog — mapa wspólnego kodu</title>
<style>
:root{color-scheme:light;--ink:#132b41;--muted:#5b6c7e;--line:#d8e3eb;--paper:#fff;--bg:#f2f6fa;--blue:#1766c1;--green:#138671;--amber:#9c6900}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:30px 34px 24px;background:#132b41;color:white}header .tag{font-size:12px;letter-spacing:2px;color:#87c7ff;font-weight:700}h1{font-size:32px;letter-spacing:-.8px;margin:10px 0}header p{max-width:880px;color:#d4e1ed;margin:0}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px}.stats strong{font-size:27px;display:block}.stats span{color:#c3d6e8;font-size:13px}.toolbar{padding:18px 34px;display:flex;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line);background:var(--paper)}label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}input,select,button{font:inherit}input,select{padding:9px 11px;border:1px solid #bccddc;border-radius:7px;color:var(--ink);background:var(--paper)}input{min-width:260px}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(280px,31%) minmax(0,1fr);gap:18px;padding:22px 28px}aside,.detail{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}.list-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:650}.groups{max-height:800px;overflow:auto;padding:8px}.group{width:100%;text-align:left;background:white;border:1px solid transparent;border-bottom-color:#e8eef3;border-radius:7px;padding:14px 12px;color:var(--ink)}.group:hover{background:#f1f7fd}.group[aria-current=true]{background:#e9f3ff;border-color:#a4c9f2}.group strong{display:block;font-size:14px}.group small{display:block;color:var(--muted);margin-top:5px}.badge{display:inline-block;font-size:11px;padding:2px 7px;background:#e5f5ef;color:#116951;border-radius:20px;margin-bottom:5px}.shape{background:#fff1d3;color:var(--amber)}.detail{padding:22px}.detail h2{font-size:22px;line-height:1.25;margin:0 0 8px}.muted{color:var(--muted)}.note{font-size:13px;color:#654c16;background:#fff7e5;border-left:3px solid #cf9a28;padding:12px 14px;margin:15px 0}.map{overflow:auto;background:#f7fafc;border:1px solid var(--line);border-radius:8px;margin:18px 0;max-height:720px}.map svg{display:block;min-width:690px;width:100%;height:auto}.map text{font-family:system-ui,sans-serif;fill:#17314c}.sectionlabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:20px 0 9px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}.scroll{overflow:auto}code{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.empty{padding:35px 20px;color:var(--muted)}details{margin-top:18px;font-size:13px}summary{cursor:pointer;color:var(--blue)}footer{padding:6px 32px 28px;color:var(--muted);font-size:12px}.toolbar .download{align-self:end;margin-left:auto;padding:9px 14px;border:1px solid #b6c9da;background:#fff;color:var(--blue);border-radius:7px}.coverage{margin-top:20px;color:var(--muted);font-size:13px}.coverage li{margin:6px 0}@media(max-width:900px){main{grid-template-columns:1fr;padding:14px}header,.toolbar{padding:22px}.groups{max-height:300px}.detail{padding:16px}h1{font-size:27px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#dfebf7;--muted:#a2b5c7;--line:#34485b;--paper:#1b2a39;--bg:#14202d;--blue:#87c7ff}.group{background:var(--paper);color:var(--ink)}.group:hover{background:#283d52}.group[aria-current=true]{background:#244464;border-color:#648fb8}.map{background:#eaf0f6}.toolbar .download{background:#1b2a39}.note{background:#42371f;color:#f1d89e}header{background:#0e1b29}}
</style></head><body>
<header><div class="tag">GRAPHOLOG 0.4 / WSPÓLNA LOGIKA</div><h1>Gdzie powtarza się kod?</h1><p>Mapa grup funkcji w wielu projektach. Wybierz grupę, sprawdź pliki i lokalizacje, a następnie pobierz dowody do oceny wydzielenia biblioteki.</p><div class="stats" id="stats"></div></header>
<div class="toolbar"><label>Szukaj funkcji, pliku lub projektu<input id="search" placeholder="np. normalize, utils, billing" type="search"></label><label>Projekt<select id="project"><option value="">Wszystkie projekty</option></select></label><label>Rodzaj dopasowania<select id="match"><option value="">Wszystkie</option><option value="function-body">Zgodna składnia funkcji</option><option value="function-shape">Podobny kształt identyfikatorów</option></select></label><label>Zasięg<select id="scope"><option value="cross">Między projektami</option><option value="all">Również w jednym projekcie</option></select></label><button class="download" id="download">Pobierz dane tego widoku</button></div>
<main><aside><div class="list-head" id="list-head"></div><div class="groups" id="groups"></div></aside><section class="detail" id="detail"></section></main><footer id="footer"></footer>
<script id="workspace-data" type="application/json">__GRAPHOLOG_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('workspace-data').textContent);
const projects=new Map(data.projects.map(p=>[p.id,p]));
const byId=id=>document.getElementById(id);
function el(tag,text,className){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(className)x.className=className;return x;}
for(const [name,value] of [['Projektów',data.summary.counts.projects],['Plików w indeksie',data.summary.counts.files],['Funkcji i deklaracji',data.summary.counts.symbols],['Grup między projektami',data.summary.counts.cross_project_groups]]){const box=el('div');box.append(el('strong',value.toLocaleString('pl-PL')),el('span',name));byId('stats').append(box);}
for(const p of data.projects){const option=el('option',p.label);option.value=p.id;byId('project').append(option);}
const title=g=>g.match==='function-body'?'Zgodna składnia funkcji':'Kandydat po normalizacji nazw';
let chosen=null;
function svgEl(tag,attributes,text){const x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attributes))x.setAttribute(k,String(v));if(text!==undefined)x.textContent=text;return x;}
function shorten(text,n){return text.length>n?text.slice(0,n-1)+'…':text;}
function draw(group){
 const members=group.members.slice(0,12),h=Math.max(240,members.length*66+70),svg=svgEl('svg',{viewBox:`0 0 900 ${h}`,role:'img','aria-label':'Projekty, funkcje i wspólna grupa składni'});
 const byProject=new Map();members.forEach((m,i)=>{if(!byProject.has(m.project_id))byProject.set(m.project_id,[]);byProject.get(m.project_id).push(55+i*66);});
 const center=h/2;
 for(const [pid,ys] of byProject){const y=ys.reduce((a,b)=>a+b,0)/ys.length;svg.append(svgEl('rect',{x:14,y:y-22,width:204,height:44,rx:8,fill:'#dceaff',stroke:'#87addb'}));svg.append(svgEl('text',{x:27,y:y+5,'font-size':13},shorten(projects.get(pid).label,25)));}
 members.forEach((m,i)=>{const y=55+i*66,ys=byProject.get(m.project_id),py=ys.reduce((a,b)=>a+b,0)/ys.length;svg.append(svgEl('path',{d:`M218,${py} C250,${py} 260,${y} 290,${y}`,fill:'none',stroke:'#9ab5cd','stroke-width':1.3}));svg.append(svgEl('path',{d:`M625,${y} C675,${y} 670,${center} 710,${center}`,fill:'none',stroke:group.match==='function-body'?'#81b8ad':'#d2b56d','stroke-width':1.3}));});
 members.forEach((m,i)=>{const y=55+i*66;svg.append(svgEl('rect',{x:290,y:y-24,width:335,height:48,rx:6,fill:'#fff',stroke:'#b6cadd'}));svg.append(svgEl('text',{x:302,y:y-4,'font-size':12,'font-weight':650},shorten(m.label,43)));svg.append(svgEl('text',{x:302,y:y+14,'font-size':10},shorten(m.path+':'+m.symbol.line,54)));});
 svg.append(svgEl('rect',{x:710,y:center-40,width:174,height:80,rx:13,fill:group.match==='function-body'?'#d8f1e7':'#fff0cf',stroke:group.match==='function-body'?'#6baf96':'#cbaa60'}));svg.append(svgEl('text',{x:797,y:center-6,'font-size':13,'text-anchor':'middle'},group.match==='function-body'?'Wspólna składnia':'Wspólny kształt'));svg.append(svgEl('text',{x:797,y:center+17,'font-size':12,'text-anchor':'middle'},group.occurrences+' wystąpień'));
 return svg;
}
function details(group){const box=byId('detail');box.replaceChildren();if(!group){box.append(el('p','Brak grup dla wybranych filtrów. Zmień zasięg lub warunki wyszukiwania.','empty'));return;}
 box.append(el('h2',title(group)),el('p',`${group.language} · ${group.parser} · ${group.project_count} projektów · ${group.occurrences} wystąpień`,'muted'));
 box.append(el('p',group.match==='function-body'?'Odcisk zachowuje operatory, literały i nazwy parametrów; pomija nazwę samej deklaracji. Zależności i efekty wymagają oceny.':'Normalizacja identyfikatorów jest heurystyką. Ta grupa nie dowodzi zgodności zachowania ani poprawności wydzielenia biblioteki.','note'));
 const map=el('div',undefined,'map');map.append(draw(group));box.append(map);
 if(group.members.length>12)box.append(el('p','Diagram pokazuje 12 wystąpień; dalsze lokalizacje są w tabeli.','muted'));
 if(group.omitted_members)box.append(el('p',`Pokazano ${group.members.length} z ${group.occurrences} wystąpień. Pozostałe są dostępne przez zapytanie members do indeksu.`,'muted'));
 const allProjects=el('details');allProjects.append(el('summary','Wszystkie projekty w tej grupie ('+group.project_count+')'));const projectList=el('ul');for(const pid of Object.keys(group.project_counts).sort((a,b)=>projects.get(a).label.localeCompare(projects.get(b).label))){projectList.append(el('li',projects.get(pid).label+' — '+group.project_counts[pid]+' wystąpień'));}allProjects.append(projectList);box.append(allProjects);
 box.append(el('div','Lokalizacje i dowody','sectionlabel'));const wrap=el('div',undefined,'scroll'),table=el('table'),head=el('tr');for(const text of ['Projekt','Plik / linie','Funkcja','Rola'])head.append(el('th',text));table.append(head);
 for(const m of group.members){const row=el('tr');for(const text of [projects.get(m.project_id).label,`${m.path}:${m.symbol.line}–${m.symbol.end_line}`,m.label,m.role])row.append(el('td',text));table.append(row);}wrap.append(table);box.append(wrap);
 const d=el('details');d.append(el('summary','Identyfikatory dla CLI, MCP, REST i gRPC'));d.append(el('p','Grupa: '+group.id));const code=el('code',JSON.stringify({schema:'grapholog.request.v1',operation:'context',params:{group_ids:[group.id],max_chars:40000,max_members:12,include_source:true}},null,2));const pre=el('pre');pre.append(code);d.append(pre);box.append(d);
 const coverage=el('div',undefined,'coverage');coverage.append(el('strong','Przed wydzieleniem biblioteki'));const ul=el('ul');for(const text of ['Sprawdź importy, wywołujących, stan, zamknięcia i zachowanie błędów.','Zweryfikuj licencje i zgodność wersji zależności.','Ustal publiczne API oraz testy kontraktowe i regresyjne.','Efekty uboczne pozostają nieznane; sama zgodność hashy nie jest dowodem bezpieczeństwa zmiany.'])ul.append(el('li',text));coverage.append(ul);box.append(coverage);
}
function render(){const search=byId('search').value.toLocaleLowerCase(),project=byId('project').value,match=byId('match').value,cross=byId('scope').value==='cross';const groups=data.groups.filter(g=>(!cross||g.project_count>1)&&(!match||g.match===match)&&(!project||project in g.project_counts)&&(!search||Object.keys(g.project_counts).some(pid=>projects.get(pid).label.toLocaleLowerCase().includes(search))||g.members.some(m=>(m.label+' '+m.path).toLocaleLowerCase().includes(search))));
 byId('list-head').textContent=`${groups.length} grup w tym widoku`;if(!groups.some(g=>g.id===chosen))chosen=groups[0]?.id||null;byId('groups').replaceChildren();for(const group of groups){const b=el('button',undefined,'group');b.setAttribute('aria-current',String(group.id===chosen));b.append(el('span',group.match==='function-body'?'SKŁADNIA':'HEURYSTYKA','badge'+(group.match==='function-shape'?' shape':'')),el('strong',group.members[0]?.label||group.id),el('small',`${group.language} · ${group.project_count} projektów · ${group.occurrences} kopii`));b.addEventListener('click',()=>{chosen=group.id;render();});byId('groups').append(b);}details(groups.find(g=>g.id===chosen));}
for(const id of ['search','project','match','scope'])byId(id).addEventListener('input',render);
byId('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='grapholog-view.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
byId('footer').textContent=`Snapshot ${data.snapshot_id}. Widok offline: ${data.groups.length} grup, pominięto ${data.omitted_groups}; do 40 wystąpień na grupę. Filtrowanie dotyczy widocznych danych. Pełny graf: eksport JSON/NDJSON. Wykluczono ${data.summary.counts.excluded_entries} wpisów; katalog z poddrzewem liczony jako jeden wpis. Pokrycie w ramach profilu: ${data.summary.coverage_complete_within_policy?'pełne':'niepełne — sprawdź summary i exclusions'}. Brak wywołań LLM.`;
render();
</script></body></html>
